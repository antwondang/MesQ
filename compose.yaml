x-app: &app
  build: .
  image: internship-log:local
  init: true
  environment:
    # Keep these local database names to reuse existing installations safely.
    DATABASE_URL: postgres://triageflow:triageflow_dev@postgres:5432/triageflow
    HOST: 0.0.0.0
    PORT: 3000
  restart: unless-stopped
  stop_grace_period: 15s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: triageflow
      POSTGRES_PASSWORD: triageflow_dev
      POSTGRES_DB: triageflow
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U triageflow -d triageflow']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    command: ['node', 'dist/scripts/migrate.js']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *app
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
